aid: tiff-s-treats
name: Tiff's Treats
description: 'Tiff''s Treats is an Austin, Texas cookie company founded in 1999 by University
  of Texas students Tiffany Taylor and Leon Chen, built around warm, baked-to-order cookies
  delivered same-day. The company operates roughly 90 bakery-storefronts across Texas and
  the southern and western United States, combining walk-in retail with an owned delivery
  fleet, an online ordering platform at cookiedelivery.com, and iOS and Android ordering
  apps. Alongside consumer delivery it runs a substantial corporate gifting, catering,
  e-gift-card and special-events business, plus an "Elites" subscription membership and a
  rewards program. Tiff''s Treats has raised more than $50 million in outside investment,
  including a $25 million round led by Morgan Stanley Expansion Capital, and counts Andy
  Roddick, Brooklyn Decker, Kendra Scott and Dirk Nowitzki among its investors. It is a
  direct-to-consumer food and delivery operator, not a software vendor: it publishes no
  developer portal, no public API, and no machine-readable API contract.'
