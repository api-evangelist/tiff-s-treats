  detail: >-
    Tiff's Treats is a bakery-storefront and same-day cookie-delivery operator, not a
    software vendor; cookiedelivery.com answers HTTP 200 with the same 1457-byte SPA shell
    for every unmatched path (openapi.json, llms.txt, every /.well-known/ document), and
    api.cookiedelivery.com resolves but returns a bare IIS 404 everywhere, so there is no
    developer program to gate or document.
